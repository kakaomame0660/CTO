name: KEIRIN Historical Training

on:
  push:
    branches:
      - keirin-historical-training-20260914
    paths:
      - 'keirin_historical_train.py'
      - '.github/workflows/keirin-historical-training.yml'

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install training dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn lightgbm joblib
      - name: Train and evaluate
        run: |
          mkdir -p artifacts
          python keirin_historical_train.py | tee artifacts/stdout.txt
      - name: Upload trained artifacts
        uses: actions/upload-artifact@v4
        with:
          name: keirin-historical-training-artifacts
          path: artifacts/
          retention-days: 30
      - name: Commit reports back to isolated branch
        if: success()
        run: |
          git config user.name 'keirin-training-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add artifacts/report.json artifacts/report.md
          if git diff --cached --quiet; then
            echo 'No report changes to commit'
          else
            git commit -m 'Add KEIRIN historical training results'
            git push
          fi
